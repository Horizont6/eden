name: Build Eden (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      # 直接从原仓库的 20260808 版本拉取全部源码，不需要自己上传
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: jack-thegeek/mirror
          ref: 20260808
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      # 修复新版 MSVC 下 sparse_large_vector.cpp 第29行的类型转换报错
      - name: Patch source
        shell: pwsh
        run: |
          $f = "src/common/sparse_large_vector.cpp"
          $old = 'reinterpret_cast<u64>(info->ExceptionRecord->ExceptionInformation[1])'
          $new = 'static_cast<u64>(info->ExceptionRecord->ExceptionInformation[1])'
          $text = Get-Content $f -Raw
          if (-not $text.Contains($old)) { throw "patch target not found" }
          $text.Replace($old, $new) | Set-Content $f -NoNewline

          # 把 MSVC 的 "警告当作错误" (/weXXXX) 改成 "关闭该警告" (/wdXXXX)，
          # 否则新版 MSVC 下第三方代码 (zstd 等) 的警告会导致编译失败
          Get-ChildItem -Path src -Recurse -Filter CMakeLists.txt | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $n = $c -replace '/we(\d{4})', '/wd$1'
            if ($n -ne $c) { Set-Content -Path $_.FullName -Value $n -NoNewline }
          }

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DYUZU_TESTS=OFF
          -DENABLE_WERROR=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel -- -k 0 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # 编译失败时，把所有错误行集中显示在这里
      - name: Show errors
        if: failure()
        shell: pwsh
        run: |
          Select-String -Path build.log -Pattern 'FAILED:|error C\d+|error LNK\d+|fatal error' | ForEach-Object { $_.Line }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eden-windows
          path: build/bin/
