name: Build Eden (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      # 直接从原仓库的 20260808 版本拉取全部源码，不需要自己上传
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: jack-thegeek/mirror
          ref: 20260808
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DYUZU_TESTS=OFF
          -DENABLE_WERROR=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eden-windows
          path: build/bin/
